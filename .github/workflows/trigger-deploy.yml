name: Deploy Trigger.dev tasks
on:
  push:
    branches: [main]
    paths:
      - "src/trigger/**"
      - "trigger.config.ts"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Check for TRIGGER_ACCESS_TOKEN
        id: check_token
        env:
          TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::TRIGGER_ACCESS_TOKEN secret is not set — skipping Trigger.dev deploy. Add it under Repo Settings > Secrets and variables > Actions."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Trigger.dev
        if: steps.check_token.outputs.skip == 'false'
        run: npx trigger.dev@latest deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}